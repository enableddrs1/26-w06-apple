<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f4">
    <title>사과 숫자 게임</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <p class="eyebrow">🍎 NUMBER HARVEST</p>
        <h1>사과 숫자 게임</h1>
        <p class="subtitle">이웃한 숫자를 이어 합을 10의 배수로 만들어 보세요.</p>
      </header>

      <section class="scoreboard" aria-label="게임 정보">
        <div class="score-card">
          <span class="score-label">내 점수</span>
          <strong id="score" class="score-value" aria-live="polite">0</strong>
        </div>
        <div class="score-card timer-card">
          <span class="score-label">남은 시간</span>
          <strong id="timer" class="score-value" aria-live="polite">01:00</strong>
        </div>
        <div class="score-card">
          <span class="score-label">최고 점수</span>
          <strong id="best-score" class="score-value" aria-live="polite">0</strong>
        </div>
      </section>

      <section class="play-area" aria-label="게임 보드">
        <div class="board-heading">
          <p id="game-status" class="game-status" aria-live="polite">시작을 누르고 숫자를 이어 보세요!</p>
          <p class="selection-total">선택 합계 <strong id="selection-sum">0</strong></p>
        </div>
        <div id="board" class="board" role="group" aria-label="8 곱하기 8 사과 보드"></div>
        <div class="game-footer">
          <p>가로·세로로 이웃한 칸을 드래그하세요.</p>
          <button id="start-button" class="start-button" type="button">게임 시작</button>
        </div>
      </section>
      <p class="hint">합이 10, 20, 30…이 되면 숫자가 사라지고 점수를 얻어요.</p>
    </main>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </body>
</html>
